<style>
.smt{--n:#0B1F2E;--c:#F4EFE6;--t:#7FC8BA;--r:#C2492E;margin-top:28px;background:var(--n);border-radius:14px;padding:14px;color:var(--c);box-shadow:0 30px 60px -30px rgba(11,31,46,.55)}
.smt-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 12px}
.smt-tabs::-webkit-scrollbar{display:none}
.smt-tab{flex:0 0 auto;border:1px solid rgba(244,239,230,.18);background:transparent;color:rgba(244,239,230,.75);font:500 11px/1 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;padding:9px 12px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.smt-tab span{opacity:.55;margin-right:6px}
.smt-tab:hover{color:var(--c);border-color:rgba(244,239,230,.4)}
.smt-tab[aria-selected="true"]{background:var(--t);border-color:var(--t);color:var(--n)}
.smt-tab[aria-selected="true"] span{opacity:.8}
.smt-tab:focus-visible,.smt-nav:focus-visible,.smt-stage:focus-visible{outline:2px solid var(--t);outline-offset:2px}
.smt-stage{position:relative;background:#fff;border-radius:10px;overflow:hidden;aspect-ratio:1100/639;cursor:zoom-in}
.smt-stage.wide{aspect-ratio:1100/484}
.smt-stage img{width:100%;height:100%;object-fit:contain;display:block}
.smt-tag{position:absolute;top:10px;left:10px;padding:3px 9px;border-radius:999px;background:var(--r);color:#fff;font:500 10px/1.5 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;pointer-events:none}
.smt-foot{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;padding:14px 4px 4px}
.smt-cap h3{margin:0 0 4px;font-weight:600;font-size:18px;line-height:1.25;color:var(--c)}
.smt-cap p{margin:0;font-size:14px;line-height:1.55;color:rgba(244,239,230,.78);max-width:62ch}
.smt-ctl{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.smt-count{font:500 11px/1 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.08em;color:rgba(244,239,230,.6);margin-right:4px}
.smt-nav{width:36px;height:36px;border-radius:50%;border:1px solid rgba(244,239,230,.25);background:transparent;color:var(--c);font-size:18px;line-height:1;cursor:pointer}
.smt-nav:hover{background:rgba(244,239,230,.1)}
.smt-lb{position:fixed;inset:0;z-index:9999;background:rgba(11,31,46,.94);display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
.smt-lb img{max-width:100%;max-height:100%;border-radius:8px;background:#fff}
@media (max-width:600px){.smt{padding:10px;border-radius:12px}.smt-foot{flex-direction:column;gap:10px}.smt-cap h3{font-size:16px}}
</style>
<div class="smt" id="show-manager-tour">
  <div class="smt-tabs" role="tablist" aria-label="Show Manager sidebar chapters"></div>
  <div class="smt-stage" role="tabpanel" tabindex="0" title="Click to enlarge"><img alt="" decoding="async"><span class="smt-tag">&#9654; Clip</span></div>
  <div class="smt-foot">
    <div class="smt-cap" aria-live="polite"><h3></h3><p></p></div>
    <div class="smt-ctl"><span class="smt-count"></span><button type="button" class="smt-nav" data-d="-1" aria-label="Previous chapter">&#8249;</button><button type="button" class="smt-nav" data-d="1" aria-label="Next chapter">&#8250;</button></div>
  </div>
</div>
<script>
(function(){
  var B='https://cdn.prod.website-files.com/6ada7fcce8856667e38efd4b/';
  var C=[
    ['General','6ae11b5c6dd3e91e11e78b0c_sm-general.gif','Pick a show once and everything follows it.','One click jumps to that show’s row in the Contract Tracker. The confirmation email drafts itself from the show’s data, and uploads (advance, offer, contract) file straight into the right Drive folder.',1],
    ['Contracts','6ae11b5ee0af781840c707b4_sm-contracts.gif','Deal paperwork without hunting across columns.','Agency, agent contacts and contract status (issued, W-9, rider) for the selected show, edited right from the sidebar.'],
    ['Marketing','6ae11b6053f716ad767214c1_sm-marketing.gif','The whole campaign in one place.','Marketing status and contacts, a Tracking window for links, promotions and assets, and a Marketing Plan checklist with notes on every task.'],
    ['Advance','6ae11b61c21b3041b0953937_sm-advance.gif','Advancing, start to send.','Advance notes, advance and artist DOS contacts, and a one-click advance email.'],
    ['Reports','6ae11b620b0ad07e8c286a83_sm-reports.gif','Catch what’s slipping before it costs a show.','Exception reports across every show. Here: shows missing an announce date, filtered to one owner.'],
    ['Venues','6ae11b6331d89f8a29185968_sm-venues.gif','Enter venue details once, reuse them everywhere.','A venue library (DOS and production contacts, hospitality, parking, audio, Wi-Fi) that feeds the confirmation and advance emails.'],
    ['Templates','6ae11b65bf3ab11bd3a56cda_sm-templates.gif','Emails that fill themselves in.','Reusable templates with merge fields like &#123;&#123;headliner&#125;&#125; and &#123;&#123;venue&#125;&#125;, so every email pulls the show’s details automatically.'],
    ['Alerts','6ae11b678498e625df63409a_sm-alerts.gif','Reminders that run on their own.','Scheduled notifications (for example, 60 days before the show) sent to the right contact groups. Nobody has to remember.']
  ];
  var root=document.getElementById('show-manager-tour'); if(!root) return;
  var tl=root.querySelector('.smt-tabs'), st=root.querySelector('.smt-stage'), img=st.querySelector('img'),
      h=root.querySelector('.smt-cap h3'), p=root.querySelector('.smt-cap p'), ct=root.querySelector('.smt-count'), cur=0;
  var tabs=C.map(function(c,i){
    var b=document.createElement('button'); b.type='button'; b.className='smt-tab'; b.setAttribute('role','tab');
    b.innerHTML='<span>'+String(i+1).padStart(2,'0')+'</span>'+c[0];
    b.addEventListener('click',function(){show(i,true)}); tl.appendChild(b); return b;
  });
  function show(i,focus){
    cur=(i+C.length)%C.length; var c=C[cur];
    tabs.forEach(function(t,j){t.setAttribute('aria-selected',j===cur?'true':'false'); t.tabIndex=j===cur?0:-1;});
    st.classList.toggle('wide',!!c[4]);
    img.src=B+c[1]; img.alt='Show Manager sidebar: '+c[0]+' chapter, screen recording';
    h.textContent=c[0]+': '+c[2]; p.innerHTML=c[3]; ct.textContent=(cur+1)+' / '+C.length;
    if(focus){tabs[cur].focus(); tabs[cur].scrollIntoView({block:'nearest',inline:'nearest'});}
    var n=new Image(); n.src=B+C[(cur+1)%C.length][1];
  }
  tl.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'){e.preventDefault();show(cur+1,true)} else if(e.key==='ArrowLeft'){e.preventDefault();show(cur-1,true)}
    else if(e.key==='Home'){e.preventDefault();show(0,true)} else if(e.key==='End'){e.preventDefault();show(C.length-1,true)}
  });
  [].forEach.call(root.querySelectorAll('.smt-nav'),function(b){b.addEventListener('click',function(){show(cur+ +b.dataset.d)})});
  var lb=null; function close(){if(lb){lb.remove();lb=null}}
  function open(){close(); lb=document.createElement('div'); lb.className='smt-lb'; lb.setAttribute('role','dialog'); lb.setAttribute('aria-label',img.alt);
    var big=document.createElement('img'); big.src=img.src; big.alt=img.alt; lb.appendChild(big); lb.addEventListener('click',close); document.body.appendChild(lb);}
  st.addEventListener('click',open); st.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
  show(0,false);
})();
</script>
